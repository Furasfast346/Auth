<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }

        .header { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 24px; font-weight: bold; color: #1a73e8; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #bb2d3b; }
        .btn-secondary { background: #6c757d; color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 15px; font-size: 18px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .product-item, .user-item { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .product-info h4 { margin-bottom: 5px; }
        .error { color: #dc3545; font-size: 13px; margin-top: 5px; }
        .success { color: #28a745; font-size: 13px; margin-top: 5px; }
        .admin-panel { display: none; margin-top: 20px; }
        .users-list { max-height: 400px; overflow-y: auto; }
        .role-select { width: auto; min-width: 100px; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🔐 Auth System</div>
        <div id="authSection" class="user-info">
            <button id="showLoginBtn" class="btn btn-primary">Вход</button>
            <button id="showRegisterBtn" class="btn btn-secondary">Регистрация</button>
        </div>
        <div id="userSection" class="user-info" style="display: none;">
            <span>👋 <span id="userEmail"></span> (<span id="userRole"></span>)</span>
            <button id="logoutBtn" class="btn btn-danger">Выйти</button>
        </div>
    </div>

    <div id="loginForm" class="card" style="max-width: 400px; margin: 0 auto;">
        <h2>Вход</h2>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@example.com"></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="admin123"></div>
        <button id="doLoginBtn" class="btn btn-primary">Войти</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="registerForm" class="card" style="max-width: 400px; margin: 0 auto; display: none;">
        <h2>Регистрация</h2>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="user@example.com"></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="regPassword"></div>
        <div class="form-group"><label>Подтверждение пароля</label><input type="password" id="regPasswordConfirm"></div>
        <div class="form-group"><label>Имя</label><input type="text" id="regFirstName"></div>
        <div class="form-group"><label>Фамилия</label><input type="text" id="regLastName"></div>
        <div class="form-group"><label>Отчество</label><input type="text" id="regPatronymic"></div>
        <button id="doRegisterBtn" class="btn btn-primary">Зарегистрироваться</button>
        <div id="regError" class="error"></div>
    </div>

    <div id="profilePanel" style="display: none;">
        <div class="grid">
            <div class="card">
                <h2>📝 Мой профиль</h2>
                <div class="form-group"><label>Email</label><input type="email" id="profileEmail"></div>
                <div class="form-group"><label>Имя</label><input type="text" id="profileFirstName"></div>
                <div class="form-group"><label>Фамилия</label><input type="text" id="profileLastName"></div>
                <div class="form-group"><label>Отчество</label><input type="text" id="profilePatronymic"></div>
                <button id="updateProfileBtn" class="btn btn-primary">Обновить профиль</button>
                <button id="deleteProfileBtn" class="btn btn-danger" style="margin-left: 10px;">Удалить аккаунт</button>
                <div id="profileMessage"></div>
            </div>

            <div class="card">
                <h2>🛍️ Товары</h2>
                <div id="productsList">Загрузка...</div>
                <div id="productForm" style="margin-top: 15px;">
                    <h3>Новый товар</h3>
                    <input type="text" id="productName" placeholder="Название" style="margin-bottom: 10px;">
                    <input type="number" id="productPrice" placeholder="Цена" style="margin-bottom: 10px;">
                    <select id="productStock" style="margin-bottom: 10px;">
                        <option value="true">В наличии</option>
                        <option value="false">Нет в наличии</option>
                    </select>
                    <button id="createProductBtn" class="btn btn-primary">Создать</button>
                </div>
                <div id="productMessage"></div>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div class="card">
                <h2>👑 Админ-панель</h2>
                <div id="usersList">Загрузка пользователей...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8000';
    let token = localStorage.getItem('access_token');
    let currentUser = null;
    let editProductId = null;

    async function request(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        if (res.status === 401) { logout(); throw new Error('Сессия истекла'); }
        return res;
    }

    function showError(div, text) { const el = document.getElementById(div); if (el) { el.textContent = text; setTimeout(() => el.textContent = '', 3000); } }
    function showMessage(div, text, isError = false) { const el = document.getElementById(div); if (el) { el.textContent = text; el.style.color = isError ? '#dc3545' : '#28a745'; setTimeout(() => el.textContent = '', 3000); } }

    // Авторизация
    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const res = await request('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
        if (res.ok) {
            const data = await res.json();
            token = data.access_token;
            localStorage.setItem('access_token', token);
            await loadCurrentUser();
            showUIAfterLogin();
        } else { showError('loginError', 'Ошибка входа'); }
    }

    async function register() {
        const data = {
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            password_confirmation: document.getElementById('regPasswordConfirm').value,
            first_name: document.getElementById('regFirstName').value,
            last_name: document.getElementById('regLastName').value,
            patronymic: document.getElementById('regPatronymic').value || null
        };
        const res = await request('/auth/register', { method: 'POST', body: JSON.stringify(data) });
        if (res.ok) {
            const json = await res.json();
            token = json.access_token;
            localStorage.setItem('access_token', token);
            await loadCurrentUser();
            showUIAfterLogin();
        } else { showError('regError', 'Ошибка регистрации'); }
    }

    async function loadCurrentUser() {
        const res = await request('/users/me');
        if (res.ok) currentUser = await res.json();
        else currentUser = null;
    }

    function logout() {
        token = null;
        localStorage.removeItem('access_token');
        currentUser = null;
        document.getElementById('userSection').style.display = 'none';
        document.getElementById('authSection').style.display = 'flex';
        document.getElementById('profilePanel').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    }

    function showUIAfterLogin() {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('userSection').style.display = 'flex';
        document.getElementById('profilePanel').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('userEmail').textContent = currentUser?.email || '';
        document.getElementById('userRole').textContent = currentUser?.role || 'user';
        loadProfile();
        loadProducts();
        if (currentUser?.role === 'admin') loadAdminPanel();
        else document.getElementById('adminPanel').style.display = 'none';
    }

    // Профиль
    async function loadProfile() {
        const res = await request('/users/me');
        if (res.ok) {
            const user = await res.json();
            document.getElementById('profileEmail').value = user.email;
            document.getElementById('profileFirstName').value = user.first_name;
            document.getElementById('profileLastName').value = user.last_name;
            document.getElementById('profilePatronymic').value = user.patronymic || '';
        }
    }

    async function updateProfile() {
        const data = {
            email: document.getElementById('profileEmail').value,
            first_name: document.getElementById('profileFirstName').value,
            last_name: document.getElementById('profileLastName').value,
            patronymic: document.getElementById('profilePatronymic').value || null
        };
        const res = await request('/users/me', { method: 'PUT', body: JSON.stringify(data) });
        if (res.ok) showMessage('profileMessage', 'Профиль обновлён');
        else showMessage('profileMessage', 'Ошибка', true);
    }

    async function deleteAccount() {
        if (!confirm('Удалить аккаунт навсегда?')) return;
        const res = await request('/users/me', { method: 'DELETE' });
        if (res.ok) logout();
        else showMessage('profileMessage', 'Ошибка', true);
    }

    // Продукты
    async function loadProducts() {
        const res = await request('/products');
        if (res.ok) {
            const products = await res.json();
            const container = document.getElementById('productsList');
            if (products.length === 0) {
                container.innerHTML = '<p>Нет товаров</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-item" data-id="${p.id}">
                    <div><strong>${p.name}</strong> — ${p.price} ₽ (${p.in_stock ? '✅ в наличии' : '❌ нет'})</div>
                    <div>
                        <button onclick="editProduct(${p.id}, '${p.name}', ${p.price}, ${p.in_stock})">✏️</button>
                        <button onclick="deleteProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
    }

    async function createProduct() {
        const data = {
            name: document.getElementById('productName').value,
            price: parseInt(document.getElementById('productPrice').value),
            in_stock: document.getElementById('productStock').value === 'true'
        };
        const res = await request('/products', { method: 'POST', body: JSON.stringify(data) });
        if (res.ok) {
            loadProducts();
            showMessage('productMessage', 'Товар создан');
            resetProductForm();
        } else {
            showMessage('productMessage', 'Ошибка создания', true);
        }
    }

    async function updateProduct(id) {
        const data = {
            name: document.getElementById('productName').value,
            price: parseInt(document.getElementById('productPrice').value),
            in_stock: document.getElementById('productStock').value === 'true'
        };
        const res = await request(`/products/${id}`, { method: 'PUT', body: JSON.stringify(data) });
        if (res.ok) {
            loadProducts();
            showMessage('productMessage', 'Товар обновлён');
            resetProductForm();
        } else {
            showMessage('productMessage', 'Ошибка обновления', true);
        }
    }

    async function deleteProduct(id) {
        if (!confirm('Удалить товар?')) return;
        const res = await request(`/products/${id}`, { method: 'DELETE' });
        if (res.ok) loadProducts();
    }

    function resetProductForm() {
        editProductId = null;
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productStock').value = 'true';
        document.getElementById('createProductBtn').textContent = 'Создать';
        document.getElementById('createProductBtn').onclick = createProduct;
    }

    window.editProduct = (id, name, price, in_stock) => {
        editProductId = id;
        document.getElementById('productName').value = name;
        document.getElementById('productPrice').value = price;
        document.getElementById('productStock').value = in_stock ? 'true' : 'false';
        document.getElementById('createProductBtn').textContent = 'Обновить';
        document.getElementById('createProductBtn').onclick = () => updateProduct(id);
    };

    // Админка
    async function loadAdminPanel() {
        const usersRes = await request('/admin/users');
        if (!usersRes.ok) return;
        const users = await usersRes.json();
        const rolesRes = await request('/admin/roles');
        const roles = await rolesRes.json();

        document.getElementById('usersList').innerHTML = users.map(u => `
            <div class="user-item">
                <div><strong>${u.email}</strong> — ${u.first_name} ${u.last_name} (${u.is_active ? 'активен' : 'заблокирован'})</div>
                <div>
                    <select id="role-${u.id}" class="role-select">
                        ${roles.map(r => `<option value="${r.id}" ${u.role_id === r.id ? 'selected' : ''}>${r.name}</option>`).join('')}
                    </select>
                    <button onclick="changeRole(${u.id})">Назначить</button>
                    <button onclick="toggleUserActive(${u.id}, ${!u.is_active})">${u.is_active ? 'Заблокировать' : 'Активировать'}</button>
                </div>
            </div>
        `).join('');
        document.getElementById('adminPanel').style.display = 'block';
    }

    window.changeRole = async (userId) => {
        const select = document.getElementById(`role-${userId}`);
        const roleId = parseInt(select.value);
        const res = await request(`/admin/users/${userId}/role`, {
            method: 'PUT',
            body: JSON.stringify({ role_id: roleId })
        });
        if (res.ok) {
            loadAdminPanel();
            showMessage('profileMessage', 'Роль назначена', false);
        } else {
            showMessage('profileMessage', 'Ошибка назначения роли', true);
        }
    };

    window.toggleUserActive = async (userId, activate) => {
        const action = activate ? 'activate' : 'deactivate';
        const res = await request(`/admin/users/${userId}/${action}`, { method: 'PATCH' });
        if (res.ok) loadAdminPanel();
    };

    // Инициализация
    document.getElementById('showLoginBtn').onclick = () => { document.getElementById('loginForm').style.display = 'block'; document.getElementById('registerForm').style.display = 'none'; };
    document.getElementById('showRegisterBtn').onclick = () => { document.getElementById('registerForm').style.display = 'block'; document.getElementById('loginForm').style.display = 'none'; };
    document.getElementById('doLoginBtn').onclick = login;
    document.getElementById('doRegisterBtn').onclick = register;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('updateProfileBtn').onclick = updateProfile;
    document.getElementById('deleteProfileBtn').onclick = deleteAccount;
    document.getElementById('createProductBtn').onclick = createProduct;

    if (token) { loadCurrentUser().then(() => { if (currentUser) showUIAfterLogin(); else logout(); }); }
    else logout();
</script>
</body>
</html>
